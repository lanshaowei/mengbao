# Build Android APK from PWA via Bubblewrap (Google TWA)
# Usage: GitHub → Actions → "Build Android APK" → Run workflow → download "mengbao-android" artifact
name: Build Android APK

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'icon-512.png'
      - 'icon-192.png'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Configure Bubblewrap (point to system JDK + Android SDK)
        run: |
          mkdir -p "$HOME/.bubblewrap"
          JDK_PATH="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which java)")")")}"
          # setup-android 把 SDK 装到 $HOME/android-sdk；如果 ANDROID_HOME 未设则用默认值
          SDK_PATH="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "{\"jdkPath\":\"$JDK_PATH\",\"androidSdkPath\":\"$SDK_PATH\"}" > "$HOME/.bubblewrap/config.json"
          echo "--- Bubblewrap config ---"
          cat "$HOME/.bubblewrap/config.json"
          echo "--- Environment ---"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Verify environment
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la "$ANDROID_HOME" 2>/dev/null || ls -la "$HOME/android-sdk" 2>/dev/null || echo "No SDK directory found"
          # bubblewrap doctor 太严格，不强制要求
          bubblewrap doctor || echo "(doctor warnings ignored)"

      - name: Init TWA project (auto-accept defaults)
        run: |
          mkdir -p android-twa
          cd android-twa
          # 1) 预创建签名密钥（让 bubblewrap 跳过 6 个 keystore 问题）
          keytool -genkeypair \
            -alias mengbao \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore android.keystore \
            -storepass mengbao2024 \
            -keypass mengbao2024 \
            -dname "CN=Mengbao, OU=Family, O=Mengbao, L=Beihai, S=Guangxi, C=CN"
          echo '--- keystore created ---'
          ls -la android.keystore
          echo '--- starting bubblewrap init (non-interactive) ---'
          # 2) 用 printf 生成多个空行喂 inquirer 默认值
          # Bubblewrap init 会问 ~18 个问题（host/startUrl/name/launcherName/packageId/versionCode/display/orientation/themeColor/backgroundColor/iconUrl/maskable/monochrome/playBilling/locationDelegation/keyPath/keyAlias）
          # 提供 50 行足够覆盖
          printf '\n%.0s' {1..50} > /tmp/empty_inputs.txt
          bubblewrap init \
            --manifest="https://lanshaowei.github.io/mengbao/manifest.json" \
            --directory=. < /tmp/empty_inputs.txt
          EXIT_CODE=$?
          echo "--- bubblewrap init exit: $EXIT_CODE ---"
          if [ $EXIT_CODE -ne 0 ]; then
            echo '--- debug: list files ---'
            ls -la
            cat /tmp/empty_inputs.txt | head -5
            exit $EXIT_CODE
          fi
          echo '--- twa-manifest.json ---'
          cat twa-manifest.json

      - name: Build APK
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: mengbao2024
          BUBBLEWRAP_KEY_PASSWORD: mengbao2024
        run: |
          bubblewrap build --skipPwaValidation
          echo '--- APK / AAB files ---'
          find . -name '*.apk' -ls
          find . -name '*.aab' -ls

      - name: Copy artifacts with friendly names
        run: |
          cd android-twa
          mkdir -p out
          cp app/build/outputs/apk/release/app-release-signed.apk out/mengbao-1.0.0.apk || echo "No signed APK"
          cp app/build/outputs/bundle/release/app-release-bundle.aab out/mengbao-1.0.0.aab || echo "No AAB"
          cp twa-manifest.json out/twa-manifest.json
          ls -la out/

      - name: Upload APK / AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mengbao-android
          path: android-twa/out/*
          if-no-files-found: error
          retention-days: 30