# Build Android APK from PWA (直接用 gradle，不用 Bubblewrap CLI)
# Usage: GitHub → Actions → "Build Android APK" → Run workflow → 下载 "mengbao-android" artifact
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'icon-512.png'
      - 'icon-192.png'
      - 'android-twa/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '11076708'
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Make gradlew executable
        working-directory: android-twa
        run: chmod +x gradlew

      - name: Verify gradle wrapper works
        working-directory: android-twa
        run: ./gradlew --version

      - name: Build APK (release, signed)
        working-directory: android-twa
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: mengbao2024
          BUBBLEWRAP_KEY_PASSWORD: mengbao2024
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace
          echo '=== APK files ==='
          find app/build/outputs -name '*.apk' -ls

      - name: Copy artifacts with friendly names
        working-directory: android-twa
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/mengbao-1.0.0.apk 2>/dev/null \
            || cp app/build/outputs/apk/release/*.apk out/mengbao-1.0.0.apk
          ls -la out/

      - name: Upload APK / AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mengbao-android
          path: android-twa/out/*
          if-no-files-found: error
          retention-days: 30